; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32_wroom

[env:esp32_wroom]
platform = espressif32
board = esp32dev
framework = arduino
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
build_src_filter = +<*> -<calibration.cpp> -<single_leg_ik.cpp>

monitor_speed = 115200

lib_deps =
    madhephaestus/ESP32Servo

[env:leg_calibration]
extends = env:esp32_wroom
build_src_filter = -<*> +<calibration.cpp>
monitor_filters = send_on_enter
monitor_echo = yes

[env:single_leg_ik]
extends = env:esp32_wroom
build_src_filter = -<*> +<single_leg_ik.cpp> +<Joint.cpp> +<Leg.cpp> +<Kinematics.cpp> +<Motion.cpp>
monitor_filters = send_on_enter
monitor_echo = yes
